<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AON — Alumni Opportunity Network</title>
<style>
  :root{
    --bg:#F4F6F9;--ink:#15213B;--ink2:#3A465F;--muted:#7A879C;--faint:#A7B1C2;
    --card:#fff;--line:#E4E8EF;--line2:#EDF0F5;--accent:#EE9F2E;--accentd:#D88712;--match:#179B7E;--navy:#15213B;--danger:#D14B45;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .mono{font-family:var(--mono)}
  nav{position:sticky;top:0;z-index:40;background:rgba(244,246,249,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .navin{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.02em}
  .logo .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(238,159,46,.18)}
  .tabs{display:flex;gap:4px;overflow-x:auto}
  .tab{border:none;background:none;font:600 14px var(--sans);color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .tab.active{color:var(--navy);background:#fff;box-shadow:0 0 0 1px var(--line)}
  .navend{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
  .wrap{max-width:1080px;margin:0 auto;padding:30px 20px 80px}
  .btn{font:700 13.5px var(--sans);border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid transparent}
  .btn.primary{background:var(--accent);color:#3a2700;box-shadow:0 2px 0 var(--accentd)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn.match{background:var(--match);color:#fff}
  .btn.dim{background:var(--line2);color:var(--ink2)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn:disabled{opacity:.5;cursor:default}
  .eyebrow{font:700 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accentd)}
  h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;margin:10px 0}
  h2{font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
  .center{max-width:440px;margin:8vh auto 0;text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
  .field{margin-bottom:14px;text-align:left}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px var(--sans);color:var(--ink);background:#fff}
  .field textarea{min-height:74px;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(238,159,46,.15)}
  .req::after{content:" *";color:var(--accentd)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .checks{margin:6px 0 16px;display:flex;flex-direction:column;gap:8px}
  .checks label{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink2);cursor:pointer}
  .note{font-size:12px;color:var(--muted);background:var(--line2);border-radius:10px;padding:10px 12px;margin:8px 0 14px}
  .msg{font-size:13px;margin-top:12px;min-height:18px}
  .msg.ok{color:var(--match)}.msg.err{color:var(--danger)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column}
  .entry .top{display:flex;gap:12px;align-items:flex-start}
  .avatar{width:40px;height:40px;border-radius:10px;flex:0 0 40px;display:grid;place-items:center;font-weight:800;color:#fff}
  .entry h3{font-size:16px;margin:0}
  .entry .role{font-size:12.5px;color:var(--accentd);font-weight:600}
  .badge{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 7px;background:var(--line2);color:var(--ink2);margin-left:auto}
  .entry p{font-size:13px;color:var(--ink2);margin:12px 0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font:11px var(--mono);background:var(--line2);color:var(--ink2);border-radius:6px;padding:3px 8px}
  .foot{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .contact{font:12px var(--mono);color:var(--match);background:rgba(23,155,126,.1);border-radius:8px;padding:6px 10px;width:100%}
  .locked{font:11px var(--mono);color:var(--faint)}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--muted)}
  .reqrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
  .reqrow .st{font:11px var(--mono);padding:3px 9px;border-radius:999px;margin-left:auto}
  .st.pending{background:rgba(238,159,46,.14);color:var(--accentd)}.st.approved{background:rgba(23,155,126,.12);color:var(--match)}.st.declined{background:#f3e0df;color:var(--danger)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(max-width:720px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav id="nav" style="display:none"><div class="navin">
  <div class="logo"><span class="dot"></span>AON</div>
  <div class="tabs" id="tabs"></div>
  <div class="navend"><span id="who"></span><button class="btn ghost sm" id="logout">Çıkış</button></div>
</div></nav>

<div class="wrap" id="root"></div>

<script type="module">
const SUPABASE_URL  = "https://xfztfbvtfoawewbeqdkl.supabase.co";   // v1'deki ile aynı
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmenRmYnZ0Zm9hd2V3YmVxZGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NDgxNzksImV4cCI6MjA5NzIyNDE3OX0.B9nhLWQGzl0vIAu7sZCopbvYNEGPfIY34jp4Kn6rwEQ";

const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

const root=document.getElementById('root'), nav=document.getElementById('nav');
let ME=null;            // community_members satırı
let ROLE=null;          // 'aday' | 'isveren' | null
let TAB='jobs';
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLORS=["#15213B","#EE9F2E","#179B7E","#5B6CC9","#C2557A"];
const aColor=n=>{let h=0;for(const c of (n||'?'))h=(h*31+c.charCodeAt(0))%COLORS.length;return COLORS[h]};
const ini=n=>(n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const sk=s=>s.split(',').map(x=>x.trim()).filter(Boolean);

/* ---------- BOOT / AUTH ---------- */
sb.auth.onAuthStateChange(()=>route());
route();

async function route(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ _uid=null; nav.style.display='none'; return viewLogin(); }
  _uid=session.user.id;
  // üye mi?
  const { data:mem } = await sb.from('community_members').select('*').maybeSingle();
  if(!mem){ nav.style.display='none'; return viewNotMember(session.user.email); }
  ME=mem;
  // profil var mı?
  const uid=session.user.id;
  const [{data:cp},{data:ep}] = await Promise.all([
    sb.from('candidate_profiles').select('user_id').eq('user_id',uid).maybeSingle(),
    sb.from('employer_profiles').select('user_id').eq('user_id',uid).maybeSingle()
  ]);
  ROLE = cp?'aday': ep?'isveren': null;
  if(!ROLE){ nav.style.display='none'; return viewOnboard(); }
  renderNav();
  renderTab();
}

function viewLogin(){
  root.innerHTML=`<div class="center">
    <div class="eyebrow">Alumni Opportunity Network</div>
    <h1>Topluluk girişi</h1>
    <p class="sub">Sadece kayıtlı topluluk üyeleri. E-postanı gir, giriş bağlantısını yollayalım.</p>
    <div class="card">
      <div class="field"><label class="req">Üyelik e-postan</label><input id="email" type="email" placeholder="ad.soyad@..." /></div>
      <button class="btn primary" id="send" style="width:100%">Giriş bağlantısı gönder</button>
      <div class="msg" id="m"></div>
    </div>
    <p class="note" style="margin-top:14px">Bağlantı yalnızca topluluk listesinde kayıtlı e-postalara çalışır.</p>
  </div>`;
  document.getElementById('send').onclick=async()=>{
    const email=document.getElementById('email').value.trim(); const m=document.getElementById('m');
    if(!email){m.className='msg err';m.textContent='E-posta gerekli.';return;}
    m.className='msg';m.textContent='Gönderiliyor…';
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: window.location.origin+window.location.pathname }});
    if(error){m.className='msg err';m.textContent='Hata: '+error.message;}
    else{m.className='msg ok';m.textContent='Bağlantı gönderildi. E-postandaki linke tıkla.';}
  };
}

function viewNotMember(email){
  root.innerHTML=`<div class="center"><div class="card">
    <h2>Üyelik bulunamadı</h2>
    <p class="sub"><b>${esc(email)}</b> topluluk üye listemizde kayıtlı değil. Üyeysen yönetimle iletişime geç.</p>
    <button class="btn ghost" id="out">Çıkış yap</button></div></div>`;
  document.getElementById('out').onclick=()=>sb.auth.signOut();
}

/* ---------- ONBOARDING ---------- */
function viewOnboard(){
  root.innerHTML=`<div class="center" style="max-width:520px">
    <div class="eyebrow">Hoş geldin ${esc(ME.first_name)}</div>
    <h1>Nasıl katılıyorsun?</h1>
    <p class="sub">Üye no: <span class="mono">${esc(ME.membership_number)}</span></p>
    <div style="display:flex;gap:12px">
      <button class="btn ghost" style="flex:1;padding:22px" id="r-aday"><b>Aday</b><br><span style="font-weight:400;color:var(--muted);font-size:12px">İş/fırsat arıyorum</span></button>
      <button class="btn ghost" style="flex:1;padding:22px" id="r-isv"><b>İlan Veren</b><br><span style="font-weight:400;color:var(--muted);font-size:12px">Fırsat sunuyorum</span></button>
    </div></div>`;
  document.getElementById('r-aday').onclick=()=>formCandidate();
  document.getElementById('r-isv').onclick=()=>formEmployer();
}

const consentBlock=`<div class="note">KVKK / Aydınlatma metni — <i>buraya topluluğun resmi metnini ekle (hukukçu onaylı olmalı)</i>.</div>
  <div class="checks">
    <label><input type="checkbox" id="kvkk"> KVKK metnini okudum ve onaylıyorum</label>
    <label><input type="checkbox" id="priv"> Aydınlatma metnini okudum ve onaylıyorum</label>
  </div>`;

function formCandidate(){
  root.innerHTML=`<div style="max-width:640px;margin:0 auto">
    <div class="eyebrow">Aday Profili</div><h2>Profilini oluştur</h2><p class="sub">İletişim bilgilerin gizli kalır; sadece onayladığın kişilere açılır.</p>
    <div class="card">
      <div class="row2"><div class="field"><label class="req">Ad</label><input id="fn" value="${esc(ME.first_name)}"></div><div class="field"><label class="req">Soyad</label><input id="ln" value="${esc(ME.last_name)}"></div></div>
      <div class="field"><label class="req">Durum</label><select id="status"><option value="">Seç…</option><option value="ogrenci">Öğrenci</option><option value="mezun">Mezun</option></select></div>
      <div class="row2"><div class="field"><label class="req">Telefon</label><input id="phone"></div><div class="field"><label class="req">E-posta</label><input id="cemail"></div></div>
      <div class="row2"><div class="field"><label class="req">Okul / Üniversite</label><input id="school"></div><div class="field"><label class="req">Bölüm</label><input id="dept"></div></div>
      <div class="row2"><div class="field"><label>Mezuniyet yılı</label><input id="gyear"></div><div class="field"><label>Şehir</label><input id="city"></div></div>
      <div class="field"><label class="req">Kısa profil özeti</label><textarea id="summary"></textarea></div>
      <div class="field"><label>Yetenekler <span style="font-weight:400;color:var(--faint)">— virgülle</span></label><input id="skills" placeholder="Python, Excel, Solidity"></div>
      <div class="row2"><div class="field"><label>LinkedIn</label><input id="linkedin"></div><div class="field"><label>Portfolyo</label><input id="portfolio"></div></div>
      <div class="field"><label class="req">CV (PDF)</label><input id="cv" type="file" accept="application/pdf"></div>
      ${consentBlock}
      <button class="btn primary" id="save" style="width:100%">Profili Kaydet</button>
      <div class="msg" id="m"></div>
    </div></div>`;
  document.getElementById('save').onclick=saveCandidate;
}
async function saveCandidate(){
  const v=id=>document.getElementById(id).value.trim();
  const m=document.getElementById('m');
  const need={fn:v('fn'),ln:v('ln'),status:v('status'),phone:v('phone'),cemail:v('cemail'),school:v('school'),dept:v('dept'),summary:v('summary')};
  if(Object.values(need).some(x=>!x)){m.className='msg err';m.textContent='Zorunlu (*) alanları doldur.';return;}
  if(!document.getElementById('kvkk').checked||!document.getElementById('priv').checked){m.className='msg err';m.textContent='KVKK ve aydınlatma onayı zorunlu.';return;}
  const file=document.getElementById('cv').files[0];
  if(!file){m.className='msg err';m.textContent='CV yüklemek zorunlu.';return;}
  m.className='msg';m.textContent='Kaydediliyor…';
  const { data:{ user } } = await sb.auth.getUser(); const uid=user.id;
  const path=`${uid}/cv.pdf`;
  const up=await sb.storage.from('cvs').upload(path,file,{upsert:true,contentType:'application/pdf'});
  if(up.error){m.className='msg err';m.textContent='CV yüklenemedi: '+up.error.message;return;}
  const p1=await sb.from('candidate_profiles').upsert({user_id:uid,membership_number:ME.membership_number,first_name:need.fn,last_name:need.ln,status:need.status,school:need.school,department:need.dept,graduation_year:v('gyear'),city:v('city'),summary:need.summary,skills:sk(v('skills')),linkedin:v('linkedin'),portfolio:v('portfolio'),cv_path:path});
  if(p1.error){m.className='msg err';m.textContent='Hata: '+p1.error.message;return;}
  await sb.from('candidate_contacts').upsert({user_id:uid,phone:need.phone,email:need.cemail});
  await sb.from('consents').insert({user_id:uid,membership_number:ME.membership_number,kvkk_approved:true,privacy_notice_approved:true});
  route();
}

function formEmployer(){
  root.innerHTML=`<div style="max-width:640px;margin:0 auto">
    <div class="eyebrow">İlan Veren Profili</div><h2>Kendini tanıt</h2><p class="sub">İletişim bilgilerin gizli kalır.</p>
    <div class="card">
      <div class="row2"><div class="field"><label class="req">Ad</label><input id="fn" value="${esc(ME.first_name)}"></div><div class="field"><label class="req">Soyad</label><input id="ln" value="${esc(ME.last_name)}"></div></div>
      <div class="row2"><div class="field"><label class="req">Telefon</label><input id="phone"></div><div class="field"><label class="req">E-posta</label><input id="eemail"></div></div>
      <div class="row2"><div class="field"><label class="req">Kurum / Şirket</label><input id="company"></div><div class="field"><label class="req">Pozisyon / Unvan</label><input id="title"></div></div>
      ${consentBlock}
      <button class="btn primary" id="save" style="width:100%">Bilgileri Kaydet</button>
      <div class="msg" id="m"></div>
    </div></div>`;
  document.getElementById('save').onclick=saveEmployer;
}
async function saveEmployer(){
  const v=id=>document.getElementById(id).value.trim(); const m=document.getElementById('m');
  const need={fn:v('fn'),ln:v('ln'),phone:v('phone'),eemail:v('eemail'),company:v('company'),title:v('title')};
  if(Object.values(need).some(x=>!x)){m.className='msg err';m.textContent='Zorunlu alanları doldur.';return;}
  if(!document.getElementById('kvkk').checked||!document.getElementById('priv').checked){m.className='msg err';m.textContent='KVKK ve aydınlatma onayı zorunlu.';return;}
  m.className='msg';m.textContent='Kaydediliyor…';
  const { data:{ user } } = await sb.auth.getUser(); const uid=user.id;
  const p=await sb.from('employer_profiles').upsert({user_id:uid,membership_number:ME.membership_number,first_name:need.fn,last_name:need.ln,company_name:need.company,title:need.title});
  if(p.error){m.className='msg err';m.textContent='Hata: '+p.error.message;return;}
  await sb.from('employer_contacts').upsert({user_id:uid,phone:need.phone,email:need.eemail});
  await sb.from('consents').insert({user_id:uid,membership_number:ME.membership_number,kvkk_approved:true,privacy_notice_approved:true});
  route();
}

/* ---------- APP NAV ---------- */
function renderNav(){
  nav.style.display='block';
  document.getElementById('who').textContent=`${ME.first_name} · ${ROLE==='aday'?'Aday':'İlan Veren'}`;
  const tabs=[['jobs','Fırsatlar'],['cands','Adaylar'],['requests','İstekler']];
  if(ROLE==='isveren') tabs.splice(2,0,['me','İlanlarım']);
  document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>`<button class="tab ${k===TAB?'active':''}" data-t="${k}">${l}</button>`).join('');
  document.querySelectorAll('#tabs .tab').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;renderNav();renderTab();});
}
document.getElementById('logout').onclick=()=>sb.auth.signOut();

function renderTab(){
  if(TAB==='jobs') return renderJobs();
  if(TAB==='cands') return renderCands();
  if(TAB==='me') return renderMyJobs();
  if(TAB==='requests') return renderRequests();
}

/* ---------- JOBS ---------- */
async function renderJobs(){
  root.innerHTML=`<div class="eyebrow">Opportunity DB</div><h2>Fırsatlar</h2><p class="sub">Tüm üyeler görür. İletişim, ilan verenin onayıyla açılır.</p><div class="grid" id="g">Yükleniyor…</div>`;
  const { data:jobs } = await sb.from('job_posts').select('*').eq('is_published',true).order('created_at',{ascending:false});
  const { data:contacts } = await sb.from('employer_contacts').select('*'); // RLS: sadece izinli olanlar
  const cmap=Object.fromEntries((contacts||[]).map(c=>[c.user_id,c]));
  const reqs=await myRequests();
  const g=document.getElementById('g');
  if(!jobs||!jobs.length){g.outerHTML='<div class="empty">Henüz ilan yok.</div>';return;}
  g.innerHTML=jobs.map(j=>{
    const open=cmap[j.employer_user_id];
    const r=reqs.find(x=>x.to_user===j.employer_user_id);
    let action;
    if(j.employer_user_id===meId()) action='<span class="locked">Kendi ilanın</span>';
    else if(open) action=`<div class="contact">📞 ${esc(open.phone||'')} · ✉ ${esc(open.email||'')}</div>`;
    else if(r&&r.status==='pending') action='<span class="st pending">İstek gönderildi</span>';
    else if(r&&r.status==='declined') action='<span class="st declined">Reddedildi</span>';
    else action=`<button class="btn match sm" data-apply="${j.employer_user_id}" data-ctx="${j.id}">Başvur / İletişim iste</button>`;
    return `<div class="entry"><div class="top"><div class="avatar" style="background:${aColor(j.company_name)}">${ini(j.company_name)}</div>
      <div><h3>${esc(j.title)}</h3><div class="role">${esc(j.company_name)} · ${esc(j.position||'')}</div></div>
      <span class="badge">${esc(j.work_type||'')}</span></div>
      <p>${esc(j.description||'')}</p>
      <div class="chips">${j.city?`<span class="chip">📍 ${esc(j.city)}</span>`:''}${j.deadline?`<span class="chip">son: ${esc(j.deadline)}</span>`:''}</div>
      ${j.qualifications?`<p style="font-size:12.5px"><b>Nitelikler:</b> ${esc(j.qualifications)}</p>`:''}
      <div class="foot">${action}</div></div>`;
  }).join('');
  bindApply();
}

/* ---------- CANDIDATES ---------- */
async function renderCands(){
  root.innerHTML=`<div class="eyebrow">Candidate DB</div><h2>Adaylar</h2><p class="sub">Tüm üyeler görür. İletişim, adayın onayıyla açılır.</p><div class="grid" id="g">Yükleniyor…</div>`;
  const { data:cands } = await sb.from('candidate_profiles').select('*').order('created_at',{ascending:false});
  const { data:contacts } = await sb.from('candidate_contacts').select('*');
  const cmap=Object.fromEntries((contacts||[]).map(c=>[c.user_id,c]));
  const reqs=await myRequests();
  const g=document.getElementById('g');
  if(!cands||!cands.length){g.outerHTML='<div class="empty">Henüz aday yok.</div>';return;}
  g.innerHTML=cands.map(c=>{
    const open=cmap[c.user_id];
    const r=reqs.find(x=>x.to_user===c.user_id);
    let action;
    if(c.user_id===meId()) action='<span class="locked">Senin profilin</span>';
    else if(open) action=`<div class="contact">📞 ${esc(open.phone||'')} · ✉ ${esc(open.email||'')}</div>`;
    else if(r&&r.status==='pending') action='<span class="st pending">İstek gönderildi</span>';
    else if(r&&r.status==='declined') action='<span class="st declined">Reddedildi</span>';
    else action=`<button class="btn match sm" data-apply="${c.user_id}" data-ctx="aday">İletişim iste</button>`;
    return `<div class="entry"><div class="top"><div class="avatar" style="background:${aColor(c.first_name)}">${ini(c.first_name+' '+c.last_name)}</div>
      <div><h3>${esc(c.first_name)} ${esc(c.last_name)}</h3><div class="role">${esc(c.department||'')} · ${esc(c.school||'')}</div></div>
      <span class="badge">${c.status==='ogrenci'?'Öğrenci':'Mezun'}</span></div>
      <p>${esc(c.summary||'')}</p>
      <div class="chips">${(c.skills||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}${c.cv_path?'<span class="chip">CV ✓</span>':''}</div>
      <div class="foot">${action}</div></div>`;
  }).join('');
  bindApply();
}

function bindApply(){
  document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent='Gönderiliyor…';
    const to=b.dataset.apply, ctx=b.dataset.ctx;
    const ins=await sb.from('contact_requests').insert({from_user:meId(),to_user:to,context:ctx});
    if(ins.error){b.disabled=false;b.textContent='Tekrar dene';alert('Hata: '+ins.error.message);return;}
    // e-posta bildirimi (opsiyonel fonksiyon; yoksa sessiz geçer)
    try{ await fetch('/.netlify/functions/notify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({toUserId:to,fromName:ME.first_name+' '+ME.last_name})}); }catch(e){}
    renderTab();
  });
}

/* ---------- REQUESTS INBOX ---------- */
async function myRequests(){
  const { data } = await sb.from('contact_requests').select('*');
  return data||[];
}
async function renderRequests(){
  root.innerHTML=`<div class="eyebrow">İstekler</div><h2>İletişim istekleri</h2><p class="sub">Sana gelenleri onayla/reddet; onayladığında iletişiminiz karşılıklı açılır.</p><div id="in"></div><h3 style="margin-top:26px;font-size:15px">Gönderdiklerin</h3><div id="out"></div>`;
  const reqs=await myRequests();
  const incoming=reqs.filter(r=>r.to_user===meId());
  const outgoing=reqs.filter(r=>r.from_user===meId());
  document.getElementById('in').innerHTML = incoming.length?incoming.map(r=>{
    if(r.status==='pending') return `<div class="reqrow"><b>Bir üye seninle iletişime geçmek istiyor</b><div style="margin-left:auto;display:flex;gap:8px"><button class="btn match sm" data-ok="${r.id}">Onayla</button><button class="btn dim sm" data-no="${r.id}">Reddet</button></div></div>`;
    return `<div class="reqrow"><span>İstek</span><span class="st ${r.status}">${r.status==='approved'?'Onayladın':'Reddettin'}</span></div>`;
  }).join(''):'<div class="empty">Gelen istek yok.</div>';
  document.getElementById('out').innerHTML = outgoing.length?outgoing.map(r=>`<div class="reqrow"><span>İletişim isteği gönderildi</span><span class="st ${r.status}">${({pending:'Bekliyor',approved:'Onaylandı',declined:'Reddedildi'})[r.status]}</span></div>`).join(''):'<div class="empty">Gönderdiğin istek yok.</div>';
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>decide(b.dataset.ok,'approved'));
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>decide(b.dataset.no,'declined'));
}
async function decide(id,status){
  const { error }=await sb.from('contact_requests').update({status,decided_at:new Date().toISOString()}).eq('id',id);
  if(error){alert('Hata: '+error.message);return;}
  renderRequests();
}

/* ---------- EMPLOYER: MY JOBS ---------- */
async function renderMyJobs(){
  root.innerHTML=`<div class="eyebrow">İlanlarım</div><h2>İlan ver & yönet</h2>
    <div class="card" style="max-width:640px;margin-bottom:24px">
      <div class="field"><label class="req">İlan başlığı</label><input id="j_title"></div>
      <div class="row2"><div class="field"><label class="req">Kurum / Şirket</label><input id="j_comp" value="${esc('')}"></div><div class="field"><label>Pozisyon</label><input id="j_pos"></div></div>
      <div class="row2"><div class="field"><label>Çalışma tipi</label><select id="j_type"><option>Tam zamanlı</option><option>Yarı zamanlı</option><option>Staj</option><option>Remote</option><option>Hibrit</option><option>Ofis</option></select></div><div class="field"><label>Şehir</label><input id="j_city"></div></div>
      <div class="field"><label class="req">Açıklama</label><textarea id="j_desc"></textarea></div>
      <div class="field"><label>Aranan nitelikler</label><textarea id="j_qual"></textarea></div>
      <div class="field"><label>Son başvuru tarihi</label><input id="j_dl" type="date"></div>
      <button class="btn primary" id="j_save" style="width:100%">İlanı Yayınla</button><div class="msg" id="jm"></div>
    </div>
    <div class="grid" id="myg"></div>`;
  document.getElementById('j_save').onclick=postJob;
  const { data:mine }=await sb.from('job_posts').select('*').eq('employer_user_id',meId()).order('created_at',{ascending:false});
  document.getElementById('myg').innerHTML=(mine||[]).map(j=>`<div class="entry"><div class="top"><div><h3>${esc(j.title)}</h3><div class="role">${esc(j.company_name)}</div></div><span class="badge">${esc(j.work_type||'')}</span></div><p>${esc(j.description||'')}</p><div class="foot"><button class="btn dim sm" data-del="${j.id}">Sil</button></div></div>`).join('')||'<div class="empty">Henüz ilanın yok.</div>';
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('İlan silinsin mi?')){await sb.from('job_posts').delete().eq('id',b.dataset.del);renderMyJobs();}});
}
async function postJob(){
  const v=id=>document.getElementById(id).value.trim(); const m=document.getElementById('jm');
  if(!v('j_title')||!v('j_comp')||!v('j_desc')){m.className='msg err';m.textContent='Başlık, kurum ve açıklama zorunlu.';return;}
  m.className='msg';m.textContent='Yayınlanıyor…';
  const { error }=await sb.from('job_posts').insert({employer_user_id:meId(),title:v('j_title'),company_name:v('j_comp'),position:v('j_pos'),work_type:v('j_type'),city:v('j_city'),description:v('j_desc'),qualifications:v('j_qual'),deadline:v('j_dl')||null});
  if(error){m.className='msg err';m.textContent='Hata: '+error.message;return;}
  renderMyJobs();
}

/* ---------- util ---------- */
let _uid=null;
function meId(){ return _uid; }
sb.auth.getUser().then(({data})=>{ if(data.user)_uid=data.user.id; });
</script>
