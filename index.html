<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IMT Kariyer</title>
<style>
  :root{
    --bg:#08111f;
    --bg2:#0d1728;
    --panel:#101c31;
    --panel2:#15233b;
    --line:rgba(255,255,255,.08);
    --line2:rgba(255,255,255,.12);
    --text:#eef4ff;
    --muted:#9fb0cc;
    --soft:#c9d4e7;
    --gold:#e8b14c;
    --gold2:#c8922f;
    --teal:#2cc7a2;
    --danger:#ff7d7d;
    --white:#ffffff;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:var(--sans);
    background:
      radial-gradient(circle at top left, rgba(44,199,162,.10), transparent 28%),
      radial-gradient(circle at top right, rgba(232,177,76,.10), transparent 24%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    color:var(--text);
    line-height:1.5;
  }
  .mono{font-family:var(--mono)}
  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(8,17,31,.78);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .navin{
    max-width:1180px;margin:0 auto;padding:14px 22px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:800;font-size:18px;letter-spacing:-.02em;
    cursor:pointer;color:var(--text);text-decoration:none;
  }
  .brand .dot{
    width:11px;height:11px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 4px rgba(232,177,76,.18);
  }
  .tabs{display:flex;gap:6px;overflow:auto}
  .tab{
    border:none;background:none;color:var(--muted);
    font:600 14px var(--sans);padding:8px 12px;border-radius:999px;
    cursor:pointer;white-space:nowrap;
  }
  .tab.active{background:rgba(255,255,255,.08);color:var(--white)}
  .navend{
    margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .who{font-size:13px;color:var(--muted)}
  .btn{
    border:1px solid transparent;border-radius:999px;padding:10px 16px;
    font:700 13px var(--sans);cursor:pointer;
  }
  .btn.primary{
    background:var(--gold);color:#201505;box-shadow:0 2px 0 var(--gold2);
  }
  .btn.ghost{
    background:transparent;border-color:var(--line2);color:var(--text);
  }
  .btn.match{background:var(--teal);color:#06231d}
  .btn.dim{background:rgba(255,255,255,.08);color:var(--soft)}
  .btn.sm{padding:7px 12px;font-size:12px}
  .btn:disabled{opacity:.55;cursor:default}
  .wrap{max-width:1180px;margin:0 auto;padding:34px 22px 80px}
  .eyebrow{
    font:700 11px var(--mono);
    letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  }
  h1{font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.04em;margin:14px 0}
  h2{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}
  h3{margin:0}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
  .lead{font-size:18px;color:var(--soft);max-width:38rem;margin:0 0 28px}
  .hero{
    display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:stretch;
  }
  .heroPanel,.card,.entry,.step,.previewCard,.empty,.reqrow{
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 10px 40px rgba(0,0,0,.18);
  }
  .heroPanel{padding:32px}
  .heroVisual{padding:28px;display:flex;flex-direction:column;justify-content:space-between}
  .heroCtas,.previewActions{display:flex;gap:12px;flex-wrap:wrap}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
  .metric{
    padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02)
  }
  .metric b{display:block;font-size:15px;color:var(--white);margin-bottom:4px}
  .metric span{font-size:12.5px;color:var(--muted)}
  .pillRow{display:flex;gap:8px;flex-wrap:wrap}
  .pill{
    border:1px solid var(--line2);border-radius:999px;padding:7px 10px;
    font:600 12px var(--sans);color:var(--soft)
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
  .step{padding:22px}
  .step .si{font:700 11px var(--mono);letter-spacing:.16em;color:var(--gold)}
  .step h3{font-size:17px;margin:10px 0 6px}
  .step p{font-size:13.5px;color:var(--muted);margin:0}
  .sectionHead{display:flex;justify-content:space-between;gap:16px;align-items:end;margin:48px 0 18px}
  .sectionHead p{margin:0;color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .previewCard,.entry{padding:18px}
  .entry .top,.previewCard .top{display:flex;gap:12px;align-items:flex-start}
  .avatar{
    width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
    font-weight:800;color:#fff;flex:0 0 42px;
  }
  .role{font-size:12.5px;color:var(--gold);font-weight:600}
  .badge{
    margin-left:auto;background:rgba(255,255,255,.08);color:var(--soft);
    font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;
    border-radius:999px;padding:4px 8px;
  }
  .entry p,.previewCard p{font-size:13px;color:var(--soft);margin:12px 0}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    font:11px var(--mono);padding:4px 8px;border-radius:999px;
    background:rgba(255,255,255,.06);color:var(--soft)
  }
  .foot{
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    display:flex;gap:8px;align-items:center;flex-wrap:wrap
  }
  .contact{
    font:12px var(--mono);color:#9ff0da;background:rgba(44,199,162,.12);
    border-radius:12px;padding:7px 10px;width:100%
  }
  .locked{font:11px var(--mono);color:var(--muted)}
  .card{padding:24px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--soft)}
  .field input,.field textarea,.field select{
    width:100%;background:rgba(255,255,255,.03);color:var(--text);
    border:1px solid var(--line2);border-radius:14px;padding:11px 12px;
    font:14px var(--sans);
  }
  .field textarea{min-height:86px;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{
    outline:none;border-color:rgba(232,177,76,.55);box-shadow:0 0 0 3px rgba(232,177,76,.12)
  }
  .req::after{content:" *";color:var(--gold)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .note{
    font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);
    border-radius:14px;padding:10px 12px;margin:8px 0 14px
  }
  .checks{display:flex;flex-direction:column;gap:8px;margin:6px 0 16px}
  .checks label{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--soft)}
  .msg{font-size:13px;margin-top:12px;min-height:18px}
  .msg.ok{color:#82eccf}.msg.err{color:var(--danger)}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .reqrow{
    padding:14px 16px;display:flex;gap:12px;align-items:center;margin-bottom:10px
  }
  .st{
    font:11px var(--mono);padding:4px 9px;border-radius:999px;margin-left:auto
  }
  .st.pending{background:rgba(232,177,76,.14);color:var(--gold)}
  .st.approved{background:rgba(44,199,162,.14);color:#82eccf}
  .st.declined{background:rgba(255,125,125,.12);color:var(--danger)}
  .center{max-width:540px;margin:7vh auto 0}
  a{color:inherit}
  @media(max-width:900px){
    .hero,.grid2,.row2{grid-template-columns:1fr}
    .metrics{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<nav>
  <div class="navin">
    <a class="brand" id="brand-link"><span class="dot"></span>IMT Kariyer</a>
    <div class="tabs" id="tabs"></div>
    <div class="navend" id="navend"></div>
  </div>
</nav>

<div class="wrap" id="root"></div>

<script type="module">
const SUPABASE_URL  = "https://xfztfbvtfoawewbeqdkl.supabase.co";
const SUPABASE_ANON = "sb_publishable_Qhicx_XnxmBzZsmJyDTfAA_Z5rF687N";

const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

const root=document.getElementById('root');
let ME=null;
let HAS_CAND=false;
let HAS_EMP=false;
let TAB='home';
let pendingRole=localStorage.getItem('imt_pending_role');

const esc=s=>(s||'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLORS=["#2cc7a2","#e8b14c","#4b7bec","#d16ba5","#7dd3fc"];
const aColor=n=>{let h=0;for(const c of (n||'?')) h=(h*31+c.charCodeAt(0))%COLORS.length; return COLORS[h];};
const ini=n=>(n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const sk=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const memberLabel=()=>HAS_CAND&&HAS_EMP?'Aday + İlan Veren':HAS_CAND?'Aday':HAS_EMP?'İlan Veren':'Üye';

sb.auth.onAuthStateChange((event)=>{
  if(event==='TOKEN_REFRESHED') return;
  route();
});
route();
document.addEventListener('click', async (e)=>{
  const b = e.target.closest('[data-apply]');
  if(!b || b.disabled) return;
  b.disabled=true; b.textContent='Gönderiliyor…';
  const to=b.dataset.apply, ctx=b.dataset.ctx;
  const ins=await sb.from('contact_requests').insert({from_user:meId(),to_user:to,context:ctx});
  if(ins.error){ b.disabled=false; b.textContent='Tekrar dene'; alert('Hata: '+ins.error.message); return; }
  try{
    await fetch('/.netlify/functions/notify',{
      method:'POST', headers:{'content-type':'application/json'},
      body:JSON.stringify({toUserId:to,fromUserId:meId(),fromName:ME.first_name+' '+ME.last_name,context:ctx})
    });
  }catch(_){}
  renderTab();
});
async function route(){
 try{
  const { data:{ session } } = await sb.auth.getSession();

  if(!session){
    ME=null; HAS_CAND=false; HAS_EMP=false; _uid=null;
    renderPublicNav();
    return renderPublicTab();
  }

  _uid=session.user.id;

const { data:mem, error:memberErr } = await sb
    .from('community_members')
    .select('*')
    .limit(1)
    .maybeSingle();
   
  if(memberErr) throw memberErr;
  if(!mem){
    renderPublicNav();
    return viewNotMember(session.user.email);
  }

  ME=mem;

  const uid=session.user.id;
  const [{data:cp},{data:ep}] = await Promise.all([
    sb.from('candidate_profiles').select('user_id').eq('user_id',uid).maybeSingle(),
    sb.from('employer_profiles').select('user_id').eq('user_id',uid).maybeSingle()
  ]);

  HAS_CAND=!!cp;
  HAS_EMP=!!ep;

  if(pendingRole==='aday' && !HAS_CAND){
    renderMemberNav();
    return formCandidate();
  }
  if(pendingRole==='isveren' && !HAS_EMP){
    renderMemberNav();
    return formEmployer();
  }
  if(!HAS_CAND && !HAS_EMP){
    renderMemberNav();
    return viewOnboard();
  }

   renderMemberNav();
  if (TAB === 'home') return viewLanding(true);
  return renderTab();
 }catch(e){
  root.innerHTML=`<div class="center"><div class="card">
    <h2>Bir sorun oluştu</h2><p class="sub">Sayfayı yenile.</p></div></div>`;
 }
}

/* ---------- NAV ---------- */
function renderPublicNav(){
  const tabs=[['cands','Yetenek Havuzu'],['jobs','İlanlar']];
  document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>
    `<button class="tab ${TAB===k?'active':''}" data-t="${k}">${l}</button>`
  ).join('');
  document.querySelectorAll('#tabs .tab').forEach(b=>{
    b.onclick=()=>{ TAB=b.dataset.t; renderPublicNav(); renderPublicTab(); };
  });

  document.getElementById('navend').innerHTML=`
    <button class="btn ghost sm" data-role="aday">Yetenek Havuzuna Katıl</button>
    <button class="btn primary sm" data-role="isveren">Yetenekleri Keşfet</button>
  `;
  document.querySelector('#navend [data-role="aday"]').onclick=()=>showLoginPrompt('aday');
  document.querySelector('#navend [data-role="isveren"]').onclick=()=>{ TAB='cands'; renderPublicNav(); renderPublicTab(); };
}

function renderMemberNav(){
  const tabs=[['cands','Yetenek Havuzu'],['jobs','İlanlar'],['me','İlan Ver'],['requests','İstekler']];
  document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>
    `<button class="tab ${TAB===k?'active':''}" data-t="${k}">${l}</button>`
  ).join('');
  document.querySelectorAll('#tabs .tab').forEach(b=>{
    b.onclick=()=>{ TAB=b.dataset.t; renderMemberNav(); renderTab(); };
  });

  document.getElementById('navend').innerHTML=`
    <span class="who">${esc(ME.first_name)} · ${memberLabel()}</span>
    <button class="btn ghost sm" id="logout">Çıkış</button>
  `;
  document.getElementById('logout').onclick=()=>sb.auth.signOut();
}

document.getElementById('brand-link').onclick=(e)=>{
  e.preventDefault();
  TAB='home';
  return viewLanding(!!ME);
};

function renderPublicTab(){
  if(TAB==='cands') return renderCands(true);
  if(TAB==='jobs') return renderJobs(true);
  TAB='home';
  return viewLanding(false);
}

function renderTab(){
  if(TAB==='cands') return renderCands(false);
  if(TAB==='jobs') return renderJobs(false);
  if(TAB==='requests') return renderRequests();
  if(TAB==='me') return renderMyJobs();
  TAB='home';
  return viewLanding(true);
}

/* ---------- LANDING ---------- */
async function viewLanding(isMember){
  const [candPreview, jobPreview] = await Promise.all([
    sb.from('candidate_profiles').select('*').order('created_at',{ascending:false}).limit(3),
    sb.from('job_posts').select('*').eq('is_published',true).order('created_at',{ascending:false}).limit(3)
  ]);

  const cands = candPreview.data || [];
  const jobs = jobPreview.data || [];

  root.innerHTML=`
    <section class="hero">
      <div class="heroPanel">
        <div class="eyebrow">İşletme Mühendisliği Topluluğu</div>
        <h1>Profesyonel yetenek havuzu ve topluluk içi kariyer akışı.</h1>
        <p class="lead">IMT Kariyer, topluluk üyelerimizin kariyer fırsatları için oluşturulmuş sade ve güvenli bir alan. Yetenek görünürlüğü, kontrollü etkileşim ve birlikte çalışma imkanları tek çatı altında buluşur.</p>
        <div class="heroCtas">
          <button class="btn primary" id="cta-join">Yetenek Havuzuna Katıl</button>
                    <button class="btn ghost" id="cta-browse">İlanları Gör</button>
        </div>
        <div class="metrics">
          <div class="metric"><b>Gizlilik odaklı</b><span>İletişim bilgileri herkese açık değildir.</span></div>
          <div class="metric"><b>Etkileşim kontrollü</b><span>Bağlantılar talep ve onay akışıyla kurulur.</span></div>
          <div class="metric"><b>Birlikte çalışma</b><span>Topluluk içi fırsatlar daha görünür hale gelir.</span></div>
        </div>
      </div>
      <div class="heroVisual heroPanel">
        <div>
          <div class="eyebrow">Kısa Bakış</div>
          <h2 style="margin-top:8px">Topluluk içinde görünürlük, güven ve akış.</h2>
          <p class="sub" style="margin-top:10px">Profilini öne çıkar, fırsatları keşfet, iletişimi sadece istediğinde aç.</p>
        </div>
        <div class="pillRow">
          <span class="pill">Yetenek Havuzu</span>
          <span class="pill">İlanlar</span>
          <span class="pill">Gizli İletişim</span>
          <span class="pill">Onaylı Erişim</span>
        </div>
      </div>
    </section>

    <section class="grid2">
      <div class="step">
        <div class="si">01 · GÖRÜNÜRLÜK</div>
        <h3>Yetenekleri keşfet</h3>
        <p>Yetenek havuzu ve ilanlar giriş yapmadan incelenebilir. Böylece topluluğun güncel fırsat akışı ilk bakışta anlaşılır.</p>
      </div>
      <div class="step">
        <div class="si">02 · KATILIM</div>
        <h3>Üye hesabınla ilerle</h3>
        <p>Profil oluşturmak, ilan vermek ve iletişim talebi göndermek için toplulukta kayıtlı e-posta adresinle giriş yapılır.</p>
      </div>
      <div class="step">
        <div class="si">03 · GİZLİLİK</div>
        <h3>Bilgini sen aç</h3>
        <p>Telefon ve e-posta herkese görünmez. İletişim bilgileri yalnızca karşılıklı onay sonrasında açılır.</p>
      </div>
      <div class="step">
        <div class="si">04 · BİRLİKTE ÇALIŞMA</div>
        <h3>Topluluk içi bağ kur</h3>
        <p>İş arayan üyeler ile fırsat sunan üyeler aynı alanda buluşur; daha derli toplu ve güvenli bir kariyer akışı oluşur.</p>
      </div>
    </section>

    <div class="sectionHead">
      <div>
        <div class="eyebrow">Yetenek Havuzu</div>
        <h2>Öne çıkan profiller</h2>
        <p>${isMember ? 'Üye olarak tam detayları görebilir ve iletişim talebi gönderebilirsin.' : 'Public önizleme: iletişim ve etkileşim için giriş gerekir.'}</p>
      </div>
      <div class="previewActions">
        <button class="btn ghost sm" id="go-cands">Tüm havuzu gör</button>
      </div>
    </div>
    <div class="grid" id="candPreviewGrid"></div>

    <div class="sectionHead">
      <div>
        <div class="eyebrow">İlanlar</div>
        <h2>Güncel fırsatlar</h2>
        <p>${isMember ? 'Üye olarak talep bırakabilir ve kendi ilanını yönetebilirsin.' : 'Public önizleme: başvuru ve iletişim için giriş gerekir.'}</p>
      </div>
      <div class="previewActions">
        <button class="btn ghost sm" id="go-jobs">Tüm ilanları gör</button>
      </div>
    </div>
    <div class="grid" id="jobPreviewGrid"></div>
  `;

  document.getElementById('cta-join').onclick=()=> isMember ? formCandidate() : showLoginPrompt('aday');
  document.getElementById('cta-browse').onclick=()=>{ TAB='jobs'; isMember ? renderTab() : renderPublicTab(); };
  document.getElementById('go-cands').onclick=()=>{ TAB='cands'; isMember ? renderTab() : renderPublicTab(); };
  document.getElementById('go-jobs').onclick=()=>{ TAB='jobs'; isMember ? renderTab() : renderPublicTab(); };

  document.getElementById('candPreviewGrid').innerHTML = cands.length
    ? cands.map(c=>previewCandidateCard(c, !isMember)).join('')
    : `<div class="empty">Henüz aday profili yok.</div>`;

  document.getElementById('jobPreviewGrid').innerHTML = jobs.length
    ? jobs.map(j=>previewJobCard(j, !isMember)).join('')
    : `<div class="empty">Henüz ilan yok.</div>`;

  bindLoginCtas();
}

function previewCandidateCard(c, isPublic){
  const name = isPublic ? `${esc(c.first_name)} ${esc((c.last_name||'')[0] || '')}.` : `${esc(c.first_name)} ${esc(c.last_name)}`;
  return `
    <div class="previewCard">
      <div class="top">
        <div class="avatar" style="background:${aColor(c.first_name)}">${ini(c.first_name+' '+c.last_name)}</div>
        <div>
          <h3>${name}</h3>
          <div class="role">${esc(c.department || 'İşletme Mühendisliği')}</div>
        </div>
        <span class="badge">${c.status==='ogrenci'?'Öğrenci':'Mezun'}</span>
      </div>
      <p>${esc(c.summary || '')}</p>
      <div class="chips">${(c.skills||[]).slice(0,4).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>
      <div class="foot">
        ${isPublic ? `<button class="btn ghost sm" data-role="aday">Katılmak için giriş yap</button>` : `<span class="locked">Tam profil için havuza git</span>`}
      </div>
    </div>
  `;
}

function previewJobCard(j, isPublic){
  return `
    <div class="previewCard">
      <div class="top">
        <div class="avatar" style="background:${aColor(j.company_name)}">${ini(j.company_name)}</div>
        <div>
          <h3>${esc(j.title)}</h3>
          <div class="role">${esc(j.company_name)} · ${esc(j.position || '')}</div>
        </div>
        <span class="badge">${esc(j.work_type || 'İlan')}</span>
      </div>
      <p>${esc(j.description || '')}</p>
      <div class="chips">
        ${j.city ? `<span class="chip">📍 ${esc(j.city)}</span>` : ''}
        ${j.deadline ? `<span class="chip">son: ${esc(j.deadline)}</span>` : ''}
      </div>
      <div class="foot">
        ${isPublic ? `<button class="btn ghost sm" data-role="isveren">Etkileşim için giriş yap</button>` : `<span class="locked">Detay için ilanlara git</span>`}
      </div>
    </div>
  `;
}

/* ---------- LOGIN ---------- */
function showLoginPrompt(role){
  pendingRole=role;
  localStorage.setItem('imt_pending_role', pendingRole);

  root.innerHTML=`
    <div class="center">

async function saveCandidate(){
  const v=id=>document.getElementById(id).value.trim();
  const m=document.getElementById('m');
  const need={fn:v('fn'),ln:v('ln'),status:v('status'),phone:v('phone'),cemail:v('cemail'),summary:v('summary')};

  if(Object.values(need).some(x=>!x)){ m.className='msg err'; m.textContent='Zorunlu alanları doldur.'; return; }
  if(!document.getElementById('kvkk').checked || !document.getElementById('priv').checked){ m.className='msg err'; m.textContent='KVKK ve aydınlatma onayı zorunlu.'; return; }

  const file=document.getElementById('cv').files[0];
  m.className='msg'; m.textContent='Kaydediliyor…';

  const { data:{ user } } = await sb.auth.getUser();
  const uid=user.id;
  let path=null;

  if(file){
    path=`${uid}/cv.pdf`;
    const up=await sb.storage.from('cvs').upload(path,file,{upsert:true,contentType:'application/pdf'});
    if(up.error){ m.className='msg err'; m.textContent='CV yüklenemedi: '+up.error.message; return; }
  }

  const p1=await sb.from('candidate_profiles').upsert({
    user_id:uid,
    membership_number:ME.membership_number,
    first_name:need.fn,
    last_name:need.ln,
    status:need.status,
    school:'İTÜ İşletme Mühendisliği',
    department:'İşletme Mühendisliği',
    graduation_year:v('gyear'),
    city:v('city'),
    summary:need.summary,
    skills:sk(v('skills')),
    linkedin:v('linkedin'),
    portfolio:v('portfolio'),
    cv_path:path
  });

  if(p1.error){ m.className='msg err'; m.textContent='Hata: '+p1.error.message; return; }

  await sb.from('candidate_contacts').upsert({user_id:uid,phone:need.phone,email:need.cemail});
  await sb.from('consents').insert({user_id:uid,membership_number:ME.membership_number,kvkk_approved:true,privacy_notice_approved:true});

  localStorage.removeItem('imt_pending_role');
  pendingRole=null;
  TAB='cands';
  route();
}

    return `

  document.querySelectorAll('[data-del-cand]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Yetenek havuzundaki paylaşımın silinsin mi?')) return;
    b.disabled=true;
    b.textContent='Siliniyor…';
    const { error } = await sb
      .from('candidate_profiles')
      .delete()
      .eq('user_id', b.dataset.delCand)
      .eq('user_id', meId());
    if(error){
      b.disabled=false;
      b.textContent='Paylaşımı sil';
      alert('Paylaşım silinemedi: ' + error.message);
      return;
    }
    TAB='cands';
    route();
  });
}


/* ---------- REQUESTS ---------- */
async function myRequests(){
  const { data } = await sb.from('contact_requests').select('*');
  return data || [];
}

async function renderRequests(){
  root.innerHTML=`
    <div class="eyebrow">İstekler</div>
    <h2>İletişim istekleri</h2>
    <p class="sub">Sana gelenleri onayla veya reddet; onay sonrası iletişim karşılıklı açılır.</p>
    <div id="in"></div>
    <h3 style="margin-top:26px;font-size:16px">Gönderdiklerin</h3>
    <div id="out"></div>
  `;

  const reqs=await myRequests();
  const incoming=reqs.filter(r=>r.to_user===meId());
  const outgoing=reqs.filter(r=>r.from_user===meId());

  document.getElementById('in').innerHTML = incoming.length
    ? incoming.map(r=>{
        if(r.status==='pending'){
          return `<div class="reqrow"><b>Bir üye seninle iletişime geçmek istiyor</b><div style="margin-left:auto;display:flex;gap:8px"><button class="btn match sm" data-ok="${r.id}">Onayla</button><button class="btn dim sm" data-no="${r.id}">Reddet</button></div></div>`;
        }
        return `<div class="reqrow"><span>İstek</span><span class="st ${r.status}">${r.status==='approved'?'Onayladın':'Reddettin'}</span></div>`;
      }).join('')
    : `<div class="empty">Gelen istek yok.</div>`;

  document.getElementById('out').innerHTML = outgoing.length
    ? outgoing.map(r=>`<div class="reqrow"><span>İletişim isteği gönderildi</span><span class="st ${r.status}">${({pending:'Bekliyor',approved:'Onaylandı',declined:'Reddedildi'})[r.status]}</span></div>`).join('')
    : `<div class="empty">Gönderdiğin istek yok.</div>`;

  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>decide(b.dataset.ok,'approved'));
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>decide(b.dataset.no,'declined'));
}

async function decide(id,status){
  const { error }=await sb.from('contact_requests').update({status,decided_at:new Date().toISOString()}).eq('id',id);
  if(error){ alert('Hata: '+error.message); return; }
  renderRequests();
}

/* ---------- EMPLOYER JOBS ---------- */
async function renderMyJobs(){
  if(!HAS_EMP) return formEmployer();

  root.innerHTML=`
    <div class="eyebrow">İlan Yönetimi</div>
    <h2>İlan ver</h2>
    <div class="card" style="max-width:700px;margin-bottom:24px">
      <div class="field"><label class="req">İlan başlığı</label><input id="j_title"></div>
      <div class="row2">
        <div class="field"><label class="req">Kurum / Şirket</label><input id="j_comp"></div>
        <div class="field"><label>Pozisyon</label><input id="j_pos"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Çalışma tipi</label>
          <select id="j_type">
            <option>Tam zamanlı</option>
            <option>Yarı zamanlı</option>
            <option>Staj</option>
            <option>Remote</option>
            <option>Hibrit</option>
            <option>Ofis</option>
          </select>
        </div>
        <div class="field"><label>Şehir</label><input id="j_city"></div>
      </div>
      <div class="field"><label class="req">Açıklama</label><textarea id="j_desc"></textarea></div>
      <div class="field"><label>Aranan nitelikler</label><textarea id="j_qual"></textarea></div>
      <div class="field"><label>Son başvuru tarihi</label><input id="j_dl" type="date"></div>
      <div class="field"><label>Başvuru / ilan linki (opsiyonel)</label><input id="j_url" placeholder="https://..."></div>
      <button class="btn primary" id="j_save" style="width:100%">İlanı Yayınla</button>
      <div class="msg" id="jm"></div>
    </div>
    <div class="grid" id="myg"></div>
  `;

  document.getElementById('j_save').onclick=postJob;
  const { data:mine }=await sb.from('job_posts').select('*').eq('employer_user_id',meId()).order('created_at',{ascending:false});

  document.getElementById('myg').innerHTML=(mine||[]).map(j=>`
    <div class="entry">
      <div class="top">
        <div><h3>${esc(j.title)}</h3><div class="role">${esc(j.company_name)}</div></div>
        <span class="badge">${esc(j.work_type||'İlan')}</span>
      </div>
      <p>${esc(j.description||'')}</p>
      <div class="foot"><button class="btn dim sm" data-del="${j.id}">Sil</button></div>
    </div>
  `).join('') || `<div class="empty">Henüz ilanın yok.</div>`;

  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(confirm('İlan silinsin mi?')){
      const { error } = await sb
        .from('job_posts')
        .delete()
        .eq('id', b.dataset.del)
        .eq('employer_user_id', meId());
      if(error){
        alert('İlan silinemedi: ' + error.message);
        return;
      }
      renderMyJobs();
    }
  });
}

async function postJob(){
  const v=id=>document.getElementById(id).value.trim();
  const m=document.getElementById('jm');

  if(!v('j_title') || !v('j_comp') || !v('j_desc')){
    m.className='msg err'; m.textContent='Başlık, kurum ve açıklama zorunlu.'; return;
  }

  m.className='msg'; m.textContent='Yayınlanıyor…';
  const { error }=await sb.from('job_posts').insert({
    employer_user_id:meId(),
    title:v('j_title'),
    company_name:v('j_comp'),
    position:v('j_pos'),
    work_type:v('j_type'),
    city:v('j_city'),
    description:v('j_desc'),
    qualifications:v('j_qual'),
    deadline:v('j_dl') || null,
    apply_url:v('j_url') || null,
    is_published:true
  });

  if(error){ m.className='msg err'; m.textContent='Hata: '+error.message; return; }
  renderMyJobs();
}

/* ---------- UTIL ---------- */
let _uid=null;
function meId(){ return _uid; }
sb.auth.getUser().then(({data})=>{ if(data.user) _uid=data.user.id; });
</script>
